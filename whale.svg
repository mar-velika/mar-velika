<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1116"/>
      <stop offset="55%" stop-color="#0a1a22"/>
      <stop offset="100%" stop-color="#050708"/>
    </linearGradient>
    <path id="swimpath" d="M -120,120 C 60,85 160,155 340,120 S 620,85 700,120 S 980,155 1100,120" fill="none"/>
  </defs>

  <rect width="900" height="220" fill="url(#ocean)"/>

  <!-- surface ripple lines -->
  <g stroke="#2c3a42" stroke-width="1" opacity="0.5" fill="none">
    <path d="M0,20 C 60,10 120,30 180,20 S 300,10 360,20 S 480,30 540,20 S 660,10 720,20 S 840,30 900,20"/>
    <path d="M0,34 C 60,26 120,42 180,34 S 300,26 360,34 S 480,42 540,34 S 660,26 720,34 S 840,42 900,34"/>
  </g>

  <!-- faint seafloor -->
  <path d="M0,200 C 150,190 250,208 400,198 S 650,188 800,202 L900,220 L0,220 Z" fill="#04060a" opacity="0.8"/>

  <!-- krill / pellets eaten along the path (pac-man reference) -->
  <g fill="#cfd8dc">
    <circle cx="150" cy="102" r="4.5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.148;0.198;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="140" r="4.5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.256;0.306;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="102" r="4.5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.363;0.413;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="140" r="4.5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.471;0.521;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="102" r="4.5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.578;0.628;1" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- rising bubbles -->
  <g fill="#3d4c54">
    <circle cx="120" cy="190" r="3" opacity="0.7">
      <animate attributeName="cy" values="190;20" dur="4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="200" r="2.2" opacity="0.6">
      <animate attributeName="cy" values="200;30" dur="5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="185" r="2.6" opacity="0.65">
      <animate attributeName="cy" values="185;15" dur="4.5s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;0" dur="4.5s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- the whale -->
  <g>
    <animateMotion dur="10s" repeatCount="indefinite" rotate="auto">
      <mpath href="#swimpath"/>
    </animateMotion>

    <!-- tail flukes, flap independently, attached at tail-stock joint -->
    <g transform="translate(-68,-2)">
      <path d="M0,0 C -12,-10 -24,-13 -34,-16 C -26,-6 -20,-2 -14,0 Z" fill="#333f45">
        <animateTransform attributeName="transform" type="rotate" values="-12;12;-12" dur="1.1s" repeatCount="indefinite"/>
      </path>
      <path d="M0,0 C -12,10 -24,13 -34,16 C -26,6 -20,2 -14,0 Z" fill="#3a474e">
        <animateTransform attributeName="transform" type="rotate" values="-12;12;-12" dur="1.1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- body silhouette -->
    <path d="M 55,-6
             C 50,-18 20,-24 -10,-20
             C -35,-17 -55,-14 -68,-8
             C -55,-12 -40,-13 -25,-10
             C -8,-5 6,10 -10,14
             C -35,17 -55,13 -68,4
             C -55,10 -35,14 -10,14
             C 15,18 35,14 48,4
             C 52,0 54,-3 55,-6 Z"
          fill="#465862"/>

    <!-- soft belly shading -->
    <path d="M -55,10 C -30,16 10,16 45,4 C 20,10 -15,11 -55,10 Z" fill="#37444b" opacity="0.6"/>

    <!-- pectoral fin -->
    <path d="M8,14 C 10,26 20,34 32,32 C 22,24 16,18 12,10 Z" fill="#3a474e"/>

    <!-- eye -->
    <circle cx="44" cy="-8" r="2.4" fill="#0c1116"/>

    <!-- blowhole spout -->
    <g transform="translate(14,-21)">
      <circle cx="0" cy="0" r="2" fill="#c8d3d8" opacity="0">
        <animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.5;1" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="0;-14" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="3" cy="2" r="1.4" fill="#c8d3d8" opacity="0">
        <animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.5;1" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="2;-10" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
